<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little UAE</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #87ceeb;
  overflow: hidden;
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
  background: linear-gradient(#87ceeb 0 55%, #d8b06a 55% 100%);
}

#top {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.box {
  background: rgba(255,255,255,.92);
  padding: 8px 12px;
  border-radius: 12px;
  font-weight: bold;
  box-shadow: 0 3px 10px rgba(0,0,0,.15);
}

#city {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 45%;
  background: #555;
}

.road {
  position: absolute;
  top: 45%;
  width: 100%;
  height: 100px;
  background: #333;
  border-top: 5px solid #eee;
  border-bottom: 5px solid #eee;
}

.line {
  position: absolute;
  top: 45px;
  width: 100%;
  border-top: 5px dashed #ffd700;
}

.building {
  position: absolute;
  bottom: 100px;
  width: 90px;
  height: 150px;
  background: #eee;
  border: 3px solid #333;
  border-radius: 5px;
}

.window {
  width: 18px;
  height: 25px;
  background: #62b5d8;
  margin: 8px;
  display: inline-block;
}

#home {
  left: 8%;
}

#shop {
  right: 8%;
  background: #f4c27a;
}

#player {
  position: absolute;
  width: 45px;
  height: 55px;
  bottom: 135px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  text-align: center;
  font-size: 42px;
}

#controls {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 15px;
  z-index: 20;
}

button {
  width: 65px;
  height: 55px;
  border: none;
  border-radius: 15px;
  background: white;
  font-size: 25px;
  box-shadow: 0 4px 10px rgba(0,0,0,.25);
}

#message {
  position: absolute;
  top: 75px;
  left: 50%;
  transform: translateX(-50%);
  background: white;
  padding: 10px 15px;
  border-radius: 12px;
  display: none;
  z-index: 30;
}
</style>
</head>

<body>

<div id="game">

  <div id="top">
    <div class="box">💰 AED <span id="money">100</span></div>
    <div class="box">⚡ <span id="energy">100</span>%</div>
    <div class="box">📅 Day <span id="day">1</span></div>
  </div>

  <div id="message"></div>

  <div id="city">

    <div class="building" id="home">
      <div class="window"></div>
      <div class="window"></div>
      <div class="window"></div>
      <div class="window"></div>
      <div class="window"></div>
      <div class="window"></div>
    </div>

    <div class="building" id="shop">
      <div style="text-align:center;padding-top:15px;font-weight:bold;">
        🛒 SHOP
      </div>
      <div class="window"></div>
      <div class="window"></div>
      <div class="window"></div>
      <div class="window"></div>
    </div>

    <div class="road">
      <div class="line"></div>
    </div>

  </div>

  <div id="player">🧑</div>

  <div id="controls">
    <button onclick="move(-30)">⬅️</button>
    <button onclick="work()">💼</button>
    <button onclick="move(30)">➡️</button>
  </div>

</div>

<script>

let money = 100;
let energy = 100;
let day = 1;
let playerX = 50;

const player = document.getElementById("player");

function move(amount) {

  playerX += amount / 10;

  if (playerX < 5) playerX = 5;
  if (playerX > 95) playerX = 95;

  player.style.left = playerX + "%";

  energy -= 2;

  if (energy < 0) energy = 0;

  update();
}

function work() {

  if (energy < 20) {
    showMessage("😴 Energy kuravaanu!");
    return;
  }

  money += 50;
  energy -= 20;

  showMessage("💼 Work completed! +AED 50");

  update();
}

function update() {

  document.getElementById("money").innerText = money;
  document.getElementById("energy").innerText = energy;
  document.getElementById("day").innerText = day;
}

function showMessage(text) {

  const message = document.getElementById("message");

  message.innerText = text;
  message.style.display = "block";

  setTimeout(() => {
    message.style.display = "none";
  }, 2000);
}

</script>

</body>
</html>
