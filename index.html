<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Little UAE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-user-select:none;
  user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#b9e8f5;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  touch-action:none;
}

/* BIG MAP */
#map{
  position:absolute;
  width:2400px;
  height:1800px;
  left:0;
  top:0;
  background:
    linear-gradient(90deg,transparent 0 49%,rgba(255,255,255,.18) 50%,transparent 51%),
    #d8c58d;
}

/* Sea */
.sea{
  position:absolute;
  background:#63c8df;
}

.sea1{
  width:650px;
  height:1800px;
  left:0;
  top:0;
}

.sea2{
  width:900px;
  height:300px;
  right:0;
  top:0;
}

/* Roads */
.road{
  position:absolute;
  background:#555;
  border:8px solid #777;
}

.road.h{
  width:2300px;
  height:100px;
}

.road.v{
  width:100px;
  height:1700px;
}

.line{
  position:absolute;
  background:#f5d85c;
}

/* Buildings */
.building{
  position:absolute;
  background:#e9e0cc;
  border:5px solid #b3a78d;
  border-radius:12px;
  box-shadow:4px 5px 0 rgba(0,0,0,.15);
}

.building span{
  display:block;
  text-align:center;
  margin-top:12px;
  font-weight:bold;
  color:#4d463a;
  font-size:18px;
}

/* Locations */
.location{
  position:absolute;
  padding:12px 18px;
  background:white;
  border-radius:15px;
  font-weight:bold;
  font-size:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
}

/* Palm */
.palm{
  position:absolute;
  font-size:38px;
}

/* CHARACTER */
#player{
  position:absolute;
  width:58px;
  height:72px;
  z-index:20;
  transform:translate(-50%,-50%);
  text-align:center;
  font-size:52px;
  line-height:60px;
  filter:drop-shadow(0 4px 2px rgba(0,0,0,.3));
}

#playerName{
  position:absolute;
  top:-25px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.7);
  color:white;
  padding:4px 8px;
  border-radius:8px;
  font-size:12px;
  white-space:nowrap;
}

/* TOP UI */
#ui{
  position:fixed;
  z-index:100;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.card{
  background:rgba(255,255,255,.94);
  padding:9px 13px;
  border-radius:14px;
  box-shadow:0 3px 10px rgba(0,0,0,.2);
  font-weight:bold;
  font-size:14px;
}

/* JOYSTICK */
#joystick{
  position:fixed;
  z-index:200;
  left:25px;
  bottom:25px;
  width:145px;
  height:145px;
  border-radius:50%;
  background:rgba(0,0,0,.22);
  border:3px solid rgba(255,255,255,.65);
  touch-action:none;
}

#stick{
  position:absolute;
  width:62px;
  height:62px;
  left:41px;
  top:41px;
  border-radius:50%;
  background:rgba(255,255,255,.9);
  box-shadow:0 4px 10px rgba(0,0,0,.3);
}

/* ACTION BUTTON */
#action{
  position:fixed;
  z-index:200;
  right:25px;
  bottom:35px;
  width:75px;
  height:75px;
  border-radius:50%;
  border:0;
  background:#fff;
  font-size:30px;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}

/* LOCATION TEXT */
#locationText{
  position:fixed;
  z-index:100;
  top:62px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.72);
  color:white;
  padding:8px 14px;
  border-radius:12px;
  font-size:14px;
}

/* MESSAGE */
#message{
  position:fixed;
  z-index:300;
  left:50%;
  bottom:190px;
  transform:translateX(-50%);
  background:rgba(0,0,0,.8);
  color:white;
  padding:10px 16px;
  border-radius:12px;
  opacity:0;
  transition:.3s;
  pointer-events:none;
}

#message.show{
  opacity:1;
}
</style>
</head>

<body>

<div id="game">

  <div id="map">

    <div class="sea sea1"></div>
    <div class="sea sea2"></div>

    <!-- Roads -->
    <div class="road h" style="left:100px;top:500px;"></div>
    <div class="road h" style="left:100px;top:1050px;"></div>

    <div class="road v" style="left:900px;top:80px;"></div>
    <div class="road v" style="left:1600px;top:80px;"></div>

    <!-- Road lines -->
    <div class="line" style="left:150px;top:545px;width:2200px;height:8px;"></div>
    <div class="line" style="left:150px;top:1095px;width:2200px;height:8px;"></div>
    <div class="line" style="left:945px;top:120px;width:8px;height:1600px;"></div>
    <div class="line" style="left:1645px;top:120px;width:8px;height:1600px;"></div>

    <!-- Locations -->
    <div class="location" style="left:1050px;top:300px;">
      🏙️ Abu Dhabi City
    </div>

    <div class="location" style="left:450px;top:650px;">
      🏗️ Mussafah
    </div>

    <div class="location" style="left:1050px;top:700px;">
      🏢 Shabiya
    </div>

    <div class="location" style="left:1750px;top:350px;">
      🌴 Corniche
    </div>

    <div class="location" style="left:1800px;top:800px;">
      🎢 Yas Island
    </div>

    <!-- Buildings -->
    <div class="building" style="left:350px;top:250px;width:230px;height:170px;">
      <span>🏭 Factory</span>
    </div>

    <div class="building" style="left:650px;top:700px;width:220px;height:180px;">
      <span>🏠 House</span>
    </div>

    <div class="building" style="left:1050px;top:850px;width:260px;height:190px;">
      <span>🏢 Apartment</span>
    </div>

    <div class="building" style="left:1450px;top:250px;width:250px;height:190px;">
      <span>🏨 Hotel</span>
    </div>

    <div class="building" style="left:1750px;top:1100px;width:270px;height:200px;">
      <span>🛍️ Mall</span>
    </div>

    <div class="building" style="left:350px;top:1200px;width:260px;height:180px;">
      <span>🕌 Mosque</span>
    </div>

    <!-- Palms -->
    <div class="palm" style="left:780px;top:350px;">🌴</div>
    <div class="palm" style="left:850px;top:380px;">🌴</div>
    <div class="palm" style="left:1350px;top:400px;">🌴</div>
    <div class="palm" style="left:1450px;top:500px;">🌴</div>
    <div class="palm" style="left:1900px;top:600px;">🌴</div>
    <div class="palm" style="left:2050px;top:650px;">🌴</div>

    <!-- Player -->
    <div id="player">
      🧍
      <div id="playerName">Player</div>
    </div>

  </div>

  <!-- UI -->
  <div id="ui">
    <div class="card">💰 AED <span id="money">500</span></div>
    <div class="card">⚡ <span id="energy">100</span>%</div>
  </div>

  <div id="locationText">📍 Mussafah</div>

  <!-- Joystick -->
  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="action">👋</button>

  <div id="message">Welcome to Little UAE!</div>

</div>

<script>

const map = document.getElementById("map");
const player = document.getElementById("player");
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
const action = document.getElementById("action");
const message = document.getElementById("message");
const locationText = document.getElementById("locationText");

let playerX = 600;
let playerY = 600;

let money = 500;
let energy = 100;

let joyX = 0;
let joyY = 0;
let moving = false;

const speed = 4;

/* Put player on map */
function drawPlayer(){

  player.style.left = playerX + "px";
  player.style.top = playerY + "px";

  /* Camera follows player */
  let screenX = window.innerWidth / 2 - playerX;
  let screenY = window.innerHeight / 2 - playerY;

  const minX = window.innerWidth - map.offsetWidth;
  const minY = window.innerHeight - map.offsetHeight;

  screenX = Math.min(0, Math.max(minX, screenX));
  screenY = Math.min(0, Math.max(minY, screenY));

  map.style.transform =
    `translate(${screenX}px,${screenY}px)`;

  updateLocation();
}

/* Location */
function updateLocation(){

  let name = "Little UAE";

  if(playerX < 850 && playerY > 450 && playerY < 900){
    name = "🏗️ Mussafah";
  }
  else if(playerX > 850 && playerX < 1450 && playerY > 600){
    name = "🏢 Shabiya";
  }
  else if(playerX > 950 && playerX < 1500 && playerY < 600){
    name = "🏙️ Abu Dhabi City";
  }
  else if(playerX > 1600 && playerY < 700){
    name = "🌴 Corniche";
  }
  else if(playerX > 1600 && playerY > 700){
    name = "🎢 Yas Island";
  }

  locationText.textContent = "📍 " + name;
}

/* Movement */
function gameLoop(){

  if(moving){

    playerX += joyX * speed;
    playerY += joyY * speed;

    playerX = Math.max(40, Math.min(map.offsetWidth - 40, playerX));
    playerY = Math.max(40, Math.min(map.offsetHeight - 40, playerY));

    if(energy > 0){
      energy -= 0.02;
      document.getElementById("energy").textContent =
        Math.floor(energy);
    }

    drawPlayer();
  }

  requestAnimationFrame(gameLoop);
}

/* Joystick */
function moveJoystick(clientX, clientY){

  const rect = joystick.getBoundingClientRect();

  let x = clientX - (rect.left + rect.width/2);
  let y = clientY - (rect.top + rect.height/2);

  const max = 42;

  const distance = Math.sqrt(x*x + y*y);

  if(distance > max){

    x = x / distance * max;
    y = y / distance * max;

  }

  stick.style.transform =
    `translate(${x}px,${y}px)`;

  joyX = x / max;
  joyY = y / max;

  moving = true;
}

function stopJoystick(){

  stick.style.transform = "translate(0,0)";

  joyX = 0;
  joyY = 0;

  moving = false;
}

/* Touch */
joystick.addEventListener("pointerdown",(e)=>{

  joystick.setPointerCapture(e.pointerId);

  moveJoystick(e.clientX,e.clientY);

});

joystick.addEventListener("pointermove",(e)=>{

  if(moving){
    moveJoystick(e.clientX,e.clientY);
  }

});

joystick.addEventListener("pointerup",stopJoystick);
joystick.addEventListener("pointercancel",stopJoystick);

/* Action button */
action.addEventListener("click",()=>{

  message.textContent = "👋 Hello from Little UAE!";

  message.classList.add("show");

  setTimeout(()=>{
    message.classList.remove("show");
  },1500);

});

/* Start */
drawPlayer();
gameLoop();

</script>

</body>
</html>
